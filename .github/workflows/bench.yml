name: bench

# Heavy load tests for the twelve-dollar-server-challenge submission.
# Runs the server (io_uring) on 2 runner cores and a custom C load generator
# (faithful reimplementation of bench/load.js) on the other 2, so we can find
# the real connection ceiling past k6's single-source-IP port limit.
on:
  workflow_dispatch:
    inputs:
      levels:
        description: 'matrix JSON, e.g. [{"vus":100000,"ramp":150,"hold":300,"tag":"100k"}]'
        default: ''
      server_branch:
        description: 'branch of the fork to benchmark'
        default: 'c-iouring-pr'
      submission:
        description: 'submission directory name under submissions/'
        default: 'c-iouring-ssmurfgg04-gif'
      constrained:
        description: "set to 1cpu2g for the challenge-spec mode: server on 1 core + MemoryMax=2G, swap off; loadgen gets the remaining cores"
        default: ''

permissions:
  contents: read

env:
  SERVER_REPO: ssmurfgg04-gif/twelve-dollar-server-challenge

jobs:
  bench:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(inputs.levels || '[{"vus":20000,"ramp":60,"hold":300,"tag":"20k-ref"},{"vus":100000,"ramp":150,"hold":300,"tag":"100k"},{"vus":150000,"ramp":180,"hold":300,"tag":"150k"},{"vus":200000,"ramp":240,"hold":300,"tag":"200k"}]') }}
    env:
      BRANCH: ${{ github.event_name == 'workflow_dispatch' && inputs.server_branch || 'c-iouring-pr' }}
      SUBMISSION: ${{ github.event_name == 'workflow_dispatch' && inputs.submission || 'c-iouring-ssmurfgg04-gif' }}
      CONSTRAINED: ${{ inputs.constrained }}
    steps:
      - uses: actions/checkout@v4

      - name: fetch server source
        run: |
          git clone --depth 1 -b "$BRANCH" "https://github.com/$SERVER_REPO.git" "$HOME/tdsc"
          cd "$HOME/tdsc"
          if git apply --check "$GITHUB_WORKSPACE/patches/maxconn.patch" 2>/dev/null; then
              git apply "$GITHUB_WORKSPACE/patches/maxconn.patch"; echo "maxconn.patch applied"
          else
              echo "maxconn.patch skipped (no matching hunk on this branch)"
          fi
          git log -1 --oneline; echo "submission: $SUBMISSION"

      - name: tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sqlite3 jq curl openssl unzip

      - name: seed database
        run: bash "$HOME/tdsc/seed/make-seed.sh"

      - name: install + build server
        run: |
          sudo bash "$HOME/tdsc/submissions/$SUBMISSION/install.sh"
          bash "$HOME/tdsc/submissions/$SUBMISSION/build.sh"

      - name: build loadgen
        run: bash "$GITHUB_WORKSPACE/loadgen/build.sh"

      - name: tune kernel for many connections
        run: |
          # GitHub runners ship nf_conntrack_max=262144: once that many
          # connections are tracked, new SYNs are dropped silently. The
          # sink (zero app logic) fails 300k on it identically to any real
          # server. Raise it so the bench measures the server, not the rig.
          echo "conntrack before: max=$(cat /proc/sys/net/netfilter/nf_conntrack_max 2>/dev/null || echo n/a) count=$(cat /proc/sys/net/netfilter/nf_conntrack_count 2>/dev/null || echo n/a)"
          sudo sysctl -w net.netfilter.nf_conntrack_max=1048576 2>/dev/null || echo "(no conntrack module)"
          sudo sysctl -w fs.file-max=4194304        || true
          sudo sysctl -w fs.nr_open=1048576          || true
          sudo sysctl -w net.core.somaxconn=65536    || true
          sudo sysctl -w net.ipv4.tcp_max_syn_backlog=65536 || true
          sudo sysctl -w 'net.ipv4.ip_local_port_range=1024 65535' || true
          sudo sysctl -w net.ipv4.tcp_tw_reuse=1     || true
          sudo sysctl -w 'net.ipv4.tcp_mem=786432 1048576 1572864' || true
          sudo sysctl -w 'net.ipv4.tcp_rmem=4096 87380 16777216'   || true
          sudo sysctl -w 'net.ipv4.tcp_wmem=4096 65536 16777216'   || true
          sudo sysctl -w vm.overcommit_memory=1      || true
          ulimit -n 65535 2>/dev/null || true
          nproc; free -m | head -2

      - name: bench ${{ matrix.tag }}
        run: |
          bash "$GITHUB_WORKSPACE/scripts/run-bench.sh" \
            "${{ matrix.vus }}" "${{ matrix.ramp }}" "${{ matrix.hold }}" \
            "${{ matrix.tag }}" "$HOME/tdsc" "$GITHUB_WORKSPACE/loadgen/loadgen" "$CONSTRAINED"

      - name: job summary
        if: always()
        run: |
          {
            if [ -n "$CONSTRAINED" ]; then
              echo "## ${{ matrix.tag }} (${{ matrix.vus }} VUs, hold ${{ matrix.hold }}s, CONSTRAINED: server 1 core + 2GB no swap, loadgen on remaining cores)"
            else
              echo "## ${{ matrix.tag }} (${{ matrix.vus }} VUs, hold ${{ matrix.hold }}s, server 2 cores)"
            fi
            echo
            echo '```'
            cat /tmp/bench/run.log 2>/dev/null | tail -25 || echo "(no run log)"
            echo '```'
            echo
            echo "server: \`${BRANCH}\` @ $(cd "$HOME/tdsc" && git rev-parse --short HEAD)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-${{ matrix.tag }}
          path: |
            /tmp/bench/run.log
            /tmp/bench/server.log
            /tmp/bench/stats.json
          if-no-files-found: ignore
